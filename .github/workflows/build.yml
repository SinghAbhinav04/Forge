name: Forge desktop builds
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    name: ${{ matrix.platform }} / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x64
            command: npx electron-builder --win nsis --x64 --publish never
          - os: windows-latest
            platform: windows
            arch: arm64
            command: npx electron-builder --win nsis --arm64 --publish never
          - os: macos-15-intel
            platform: macos
            arch: x64
            command: npx electron-builder --mac dmg zip --x64 --publish never
          - os: macos-15
            platform: macos
            arch: arm64
            command: npx electron-builder --mac dmg zip --arm64 --publish never
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            command: npx electron-builder --linux AppImage deb --x64 --publish never
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            command: npx electron-builder --linux AppImage deb --arm64 --publish never
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Check separate Chat and Workspace behavior
        if: matrix.platform == 'windows' && matrix.arch == 'x64'
        run: node scripts/smoke-chat.mjs
      - name: Check background generation, prompts, images and themes
        if: matrix.platform == 'windows' && matrix.arch == 'x64'
        run: node scripts/smoke-composer.mjs
      - name: Check training participant selection and data review
        if: matrix.platform == 'windows' && matrix.arch == 'x64'
        run: node scripts/smoke-dataset-review.mjs
      - name: Check model conversion interface and cancellation
        if: matrix.platform == 'windows' && matrix.arch == 'x64'
        run: npm run test:conversion
      - name: Check guided setup, attachments and queued chat
        if: matrix.platform == 'windows' && matrix.arch == 'x64'
        run: npm run test:journey
      - name: Check local project knowledge workflow
        if: matrix.platform == 'windows' && matrix.arch == 'x64'
        run: npm run test:knowledge
      - name: Check shell command approval
        if: matrix.platform == 'windows' && matrix.arch == 'x64'
        run: npm run test:commands
      - name: Check model benchmark interface
        if: matrix.platform == 'windows' && matrix.arch == 'x64'
        run: npm run test:benchmark
      - name: Check release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node -e 'const p=require("./package.json"); if(process.env.GITHUB_REF_NAME!=="v"+p.version) throw new Error("Tag must match package version")'
      - name: Build native packages
        run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify macOS signatures and native packaged startup
        if: matrix.platform == 'macos' && github.event_name != 'pull_request'
        run: node scripts/smoke-macos-package.mjs ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: Forge-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - run: node scripts/checksums.mjs release-assets
      - name: Publish verified build artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "Forge $RELEASE_TAG" --notes-file RELEASE_NOTES.md
